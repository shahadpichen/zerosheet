# ZeroSheet SPIRE agent: node and workload attestation for the Docker lab.
#
# The agent is the local Workload API implementation. Workloads receive no
# static credential; they connect to its Unix socket, and the Docker attestor
# asks the container runtime which labelled process made that connection.

agent {
  data_dir = "/var/lib/spire/agent"
  log_level = "INFO"
  log_format = "json"
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/run/spire/agent/public/api.sock"
  trust_bundle_path = "/run/spire/bootstrap/bundle.pem"
  trust_bundle_format = "pem"
  trust_domain = "zerosheet.internal"

  # SPIRE expands this environment reference only during provisioning. After
  # successful node attestation, the script force-recreates the container with
  # an empty value; the persistent agent key/SVID replace the consumed token.
  join_token = "${SPIRE_AGENT_JOIN_TOKEN}"

  # EC P-256 keeps certificates compact and is the SPIRE default. Naming it
  # explicitly makes the algorithm decision reviewable instead of accidental.
  workload_x509_svid_key_type = "ec-p256"
}

plugins {
  # The agent key belongs to the agent, not any workload. It persists in a
  # dedicated Docker volume so a harmless container restart does not require a
  # new bootstrap token.
  KeyManager "disk" {
    plugin_data {
      directory = "/var/lib/spire/agent"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }

  # This lab selects API and worker containers by an explicit ZeroSheet label.
  # Access to docker.sock and the host PID namespace is powerful; production
  # should use the platform-native Kubernetes, systemd, or cloud attestors and
  # isolate the node agent as a security-critical host service.
  WorkloadAttestor "docker" {
    plugin_data {
      docker_socket_path = "unix:///var/run/docker.sock"
      use_new_container_locator = true
    }
  }
}
