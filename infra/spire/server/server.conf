# ZeroSheet SPIRE server: local single-node workload-identity control plane.
#
# This file contains no private key or join token. SPIRE creates its signing
# keys and SQLite state inside the persistent `spire_server_data` Docker volume.
# The SQLite datastore is appropriate for this one-server learning lab; a
# horizontally available production control plane would use the supported
# PostgreSQL datastore and an external/HSM-backed key manager.

server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "zerosheet.internal"
  data_dir = "/var/lib/spire/server"
  socket_path = "/run/spire/server/private/api.sock"
  log_level = "INFO"
  log_format = "json"

  # Five-minute workload certificates make leaked credentials short-lived and
  # force consumers to learn automatic rotation. The server CA lives longer so
  # normal SVID rotation does not constantly replace the trust bundle.
  default_x509_svid_ttl = "5m"
  default_jwt_svid_ttl = "5m"
  agent_ttl = "30m"
  ca_ttl = "24h"
  audit_log_enabled = true

  ca_subject {
    organization = ["ZeroSheet learning trust domain"]
    common_name = "ZeroSheet SPIRE Server CA"
  }
}

plugins {
  # SQLite is owned only by SPIRE and lives outside the ZeroSheet application,
  # Keycloak, and OpenFGA databases. Identity control-plane state is not
  # product data even when the components share one physical VPS.
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }

  # Join tokens bootstrap an agent exactly once. The provisioning script gives
  # the token a ten-minute lifetime and recreates the attested agent container
  # without the consumed token afterward.
  NodeAttestor "join_token" {
    plugin_data {}
  }

  # Disk-backed keys survive container replacement in the named volume. The
  # production milestone must replace this with protected external key storage
  # and documented root/intermediate rotation procedures.
  KeyManager "disk" {
    plugin_data {
      keys_path = "/var/lib/spire/server/keys.json"
    }
  }
}
